name: Build and release Windows packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/windows-build.yml
      - scripts/build_release.py
      - scripts/verify_release.py
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShuanglingQuota-Windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/verification.json
      - name: Publish version if absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; leaving it unchanged."
            exit 0
          }
          $assets = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.zip' -or $_.Name -in 'SHA256SUMS.txt','verification.json' } | ForEach-Object { $_.FullName }
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "霜铃 $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
